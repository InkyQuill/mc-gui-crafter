name: Publish Linux release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  identity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable source identity
        run: |
          [[ "$GITHUB_REF" == refs/tags/v* ]]
          python3 scripts/release/check-version.py "$GITHUB_REF_NAME"
          test "$(git rev-parse "$GITHUB_REF^{commit}")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
  build:
    needs: identity
    uses: ./.github/workflows/linux.yml
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-packages-${{ github.sha }}
          path: release-assets
      - name: Publish verified bytes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/release/publish.sh
